# The whole backend: `docker compose up -d --build` (set JWT_SECRET and
# GOOGLE_CLIENT_ID in .env first). The API is then at https://localhost/api/v1
# (docs at https://localhost/api/docs).
#
# For local development of the API itself, start only the infrastructure:
#   docker compose up -d postgres valkey seaweedfs
# and run `npm run start:dev` / `npm run start:worker:dev` on the host.
#
# Credentials below default to development values; override them in .env
# for any shared or production deployment (and change docker/seaweedfs/s3.json).
name: resume-screener-backend

x-backend-env: &backend-env
  DATABASE_URL: postgres://${POSTGRES_USER:-screener}:${POSTGRES_PASSWORD:-screener}@postgres:5432/${POSTGRES_DB:-screener}
  DB_RUN_MIGRATIONS: 'false'
  REDIS_URL: redis://valkey:6379
  JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?Set GOOGLE_CLIENT_ID in .env}
  CORS_ORIGINS: ${CORS_ORIGINS:-}
  S3_ENDPOINT: http://seaweedfs:8333
  S3_PUBLIC_ENDPOINT: https://${FILES_DOMAIN:-files.localhost}
  S3_BUCKET: ${S3_BUCKET:-resumes}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-screener}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-screener-dev-secret}
  SCREENING_MODEL: ${SCREENING_MODEL:-mock}
  WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-4}
  SCREENING_RATE_LIMIT_PER_SECOND: ${SCREENING_RATE_LIMIT_PER_SECOND:-10}
  RETENTION_DAYS: ${RETENTION_DAYS:-365}

x-backend: &backend
  build: .
  image: resume-screener-backend:latest
  restart: unless-stopped
  environment: *backend-env

services:
  postgres:
    container_name: resume-screener-postgres
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-screener}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-screener}
      POSTGRES_DB: ${POSTGRES_DB:-screener}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 10

  # Queue backend for BullMQ (open-source Redis fork). The append-only file
  # keeps queued jobs across restarts; BullMQ requires noeviction.
  valkey:
    container_name: resume-screener-valkey
    image: valkey/valkey:8.1-alpine
    restart: unless-stopped
    command: ['valkey-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ['CMD', 'valkey-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  # Object storage for resume files, used through its S3 API. File contents
  # are encrypted on the volume servers.
  seaweedfs:
    container_name: resume-screener-seaweedfs
    image: chrislusf/seaweedfs:4.54
    restart: unless-stopped
    command:
      - server
      - -dir=/data
      - -ip=seaweedfs
      - -ip.bind=0.0.0.0
      - -master.volumeSizeLimitMB=1024
      - -volume.max=0
      - -filer.encryptVolumeData
      - -s3
      - -s3.port=8333
      - -s3.config=/etc/seaweedfs/s3.json
    ports:
      - '127.0.0.1:8333:8333'
    volumes:
      - seaweedfs-data:/data
      - ./docker/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:9333/cluster/status']
      interval: 5s
      timeout: 3s
      retries: 20

  # Applies database migrations, then exits; the API and worker wait for it.
  migrate:
    <<: *backend
    container_name: resume-screener-migrate
    restart: 'no'
    command: ['node', 'node_modules/typeorm/cli.js', 'migration:run', '-d', 'dist/database/data-source.js']
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *backend
    container_name: resume-screener-api
    command: ['node', 'dist/main']
    depends_on:
      migrate:
        condition: service_completed_successfully
      valkey:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/v1/health/ready').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 5

  # Processes resumes in the background. To process faster raise
  # WORKER_CONCURRENCY, or add a second service like this one.
  worker:
    <<: *backend
    container_name: resume-screener-worker
    command: ['node', 'dist/worker']
    stop_grace_period: 60s
    depends_on:
      migrate:
        condition: service_completed_successfully
      valkey:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy

  # HTTPS for the API and for resume download links.
  caddy:
    container_name: resume-screener-caddy
    image: caddy:2.10-alpine
    restart: unless-stopped
    environment:
      API_DOMAIN: ${API_DOMAIN:-localhost}
      FILES_DOMAIN: ${FILES_DOMAIN:-files.localhost}
    ports:
      - '${HTTP_PORT:-80}:80'
      - '${HTTPS_PORT:-443}:443'
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api:
        condition: service_healthy

  # Daily database dump into ./backups, kept for BACKUP_KEEP_DAYS days.
  backup:
    container_name: resume-screener-backup
    image: postgres:17-alpine
    restart: unless-stopped
    entrypoint: ['/bin/sh', '/usr/local/bin/backup.sh']
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-screener}
      PGPASSWORD: ${POSTGRES_PASSWORD:-screener}
      PGDATABASE: ${POSTGRES_DB:-screener}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-7}
    volumes:
      - ./docker/backup/backup.sh:/usr/local/bin/backup.sh:ro
      - ./backups:/backups
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  postgres-data:
  valkey-data:
  seaweedfs-data:
  caddy-data:
  caddy-config:
