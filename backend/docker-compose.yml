# The whole backend in one command:
#   cp .env.example .env        # fill in JWT_SECRET and GOOGLE_CLIENT_ID
#   docker compose up -d --build
# The API is then at https://localhost/api/v1 (docs at https://localhost/api/docs).
#
# For development of the API itself, start only the infrastructure:
#   docker compose up -d postgres valkey seaweedfs
# and run `npm run start:dev` / `npm run start:worker:dev` on the host.
#
# Every service reads the same settings: .env.defaults, then .env (secrets
# and overrides). Only what differs inside the Docker network is set here.
name: resume-screener-backend

x-env-files: &env-files
  env_file:
    - .env.defaults
    - .env

# The API, the worker and migrations run from one image, built once (by api).
x-app: &app
  image: resume-screener-backend:latest
  pull_policy: never
  restart: unless-stopped
  init: true
  <<: *env-files
  environment:
    POSTGRES_HOST: postgres
    REDIS_URL: redis://valkey:6379
    S3_ENDPOINT: http://seaweedfs:8333
    S3_PUBLIC_ENDPOINT: https://${FILES_DOMAIN:-files.localhost}
    # The migrate service applies them, before the API and the worker start.
    DB_RUN_MIGRATIONS: 'false'

services:
  postgres:
    container_name: resume-screener-postgres
    image: postgres:17-alpine
    restart: unless-stopped
    <<: *env-files
    ports: ['127.0.0.1:5432:5432']
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 10

  # Queue backend for BullMQ (open-source Redis fork). The append-only file
  # keeps queued jobs across restarts; BullMQ requires noeviction.
  valkey:
    container_name: resume-screener-valkey
    image: valkey/valkey:8.1-alpine
    restart: unless-stopped
    command: [valkey-server, --appendonly, 'yes', --maxmemory-policy, noeviction]
    ports: ['127.0.0.1:6379:6379']
    volumes: [valkey-data:/data]
    healthcheck:
      test: [CMD, valkey-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 10

  # Object storage for resume files, used through its S3 API. File contents
  # are encrypted on the volume servers. start.sh sets up the S3 keys from .env.
  seaweedfs:
    container_name: resume-screener-seaweedfs
    image: chrislusf/seaweedfs:4.54
    restart: unless-stopped
    <<: *env-files
    entrypoint: [/bin/sh, /start.sh]
    command:
      - server
      - -dir=/data
      - -ip=seaweedfs
      - -ip.bind=0.0.0.0
      - -master.volumeSizeLimitMB=1024
      - -volume.max=0
      - -filer.encryptVolumeData
      - -s3
      - -s3.port=8333
    ports: ['127.0.0.1:8333:8333']
    volumes:
      - seaweedfs-data:/data
      - ./docker/seaweedfs/start.sh:/start.sh:ro
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, 'http://127.0.0.1:9333/cluster/status']
      interval: 5s
      timeout: 3s
      retries: 20

  # Applies database migrations, then exits; the API and worker wait for it.
  migrate:
    <<: *app
    container_name: resume-screener-migrate
    restart: 'no'
    command: [node, node_modules/typeorm/cli.js, migration:run, -d, dist/database/data-source.js]
    depends_on:
      postgres: { condition: service_healthy }

  api:
    <<: *app
    container_name: resume-screener-api
    build: .
    pull_policy: build
    command: [node, dist/main]
    depends_on:
      migrate: { condition: service_completed_successfully }
      valkey: { condition: service_healthy }
      seaweedfs: { condition: service_healthy }
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/v1/health/ready').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 5

  # Processes resumes in the background. To process faster raise
  # WORKER_CONCURRENCY in .env, or run more workers:
  #   docker compose up -d --scale worker=3
  worker:
    <<: *app
    command: [node, dist/worker]
    stop_grace_period: 60s
    depends_on:
      migrate: { condition: service_completed_successfully }
      valkey: { condition: service_healthy }
      seaweedfs: { condition: service_healthy }

  # HTTPS for the API and for resume download links (API_DOMAIN, FILES_DOMAIN).
  caddy:
    container_name: resume-screener-caddy
    image: caddy:2.10-alpine
    restart: unless-stopped
    <<: *env-files
    ports:
      - '${HTTP_PORT:-80}:80'
      - '${HTTPS_PORT:-443}:443'
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api: { condition: service_healthy }

  # Daily database dump into ./backups, kept for BACKUP_KEEP_DAYS days.
  backup:
    container_name: resume-screener-backup
    image: postgres:17-alpine
    restart: unless-stopped
    <<: *env-files
    environment:
      POSTGRES_HOST: postgres
    entrypoint: [/bin/sh, /usr/local/bin/backup.sh]
    volumes:
      - ./docker/backup/backup.sh:/usr/local/bin/backup.sh:ro
      - ./backups:/backups
    depends_on:
      migrate: { condition: service_completed_successfully }

volumes:
  postgres-data:
  valkey-data:
  seaweedfs-data:
  caddy-data:
  caddy-config:
