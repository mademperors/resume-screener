# Local development infrastructure. Start with: docker compose up -d
# Credentials here are for local development only.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: screener
      POSTGRES_PASSWORD: screener
      POSTGRES_DB: screener
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U screener -d screener']
      interval: 5s
      timeout: 3s
      retries: 10

  # Queue backend for BullMQ (open-source Redis fork). Append-only file keeps
  # queued jobs across restarts; BullMQ requires the noeviction policy.
  valkey:
    image: valkey/valkey:8.1-alpine
    command: ['valkey-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    ports:
      - '6379:6379'
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ['CMD', 'valkey-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  # Object storage for resume files, used through its S3-compatible API.
  # File contents are encrypted on the volume servers.
  seaweedfs:
    image: chrislusf/seaweedfs:4.54
    command:
      - server
      - -dir=/data
      - -ip=seaweedfs
      - -ip.bind=0.0.0.0
      - -master.volumeSizeLimitMB=1024
      - -volume.max=0
      - -filer.encryptVolumeData
      - -s3
      - -s3.port=8333
      - -s3.config=/etc/seaweedfs/s3.json
    ports:
      - '8333:8333'
    volumes:
      - seaweedfs-data:/data
      - ./docker/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro

volumes:
  postgres-data:
  valkey-data:
  seaweedfs-data:
