name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (lint, format, build, unit tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build
      # Includes the check that docs/openapi.json matches the controllers.
      - run: npm test

  backend-e2e:
    name: Backend (e2e with Postgres, Valkey, SeaweedFS)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: screener
          POSTGRES_PASSWORD: screener
          POSTGRES_DB: screener_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U screener -d screener_e2e"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      valkey:
        image: valkey/valkey:8.1-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://screener:screener@localhost:5432/screener_e2e
      REDIS_URL: redis://localhost:6379
      S3_ENDPOINT: http://localhost:8333
      S3_ACCESS_KEY_ID: screener
      S3_SECRET_ACCESS_KEY: screener-dev-secret
    steps:
      - uses: actions/checkout@v4
      # SeaweedFS reads its S3 credentials from a file, so it can't be a plain service container.
      - name: Start SeaweedFS
        run: |
          docker run -d --name seaweedfs --network host \
            -v "$GITHUB_WORKSPACE/backend/docker/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro" \
            chrislusf/seaweedfs:4.54 server -dir=/data -ip=127.0.0.1 \
            -master.volumeSizeLimitMB=1024 -volume.max=0 -filer.encryptVolumeData \
            -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
          for _ in $(seq 1 60); do
            curl -fsS http://127.0.0.1:9333/cluster/status >/dev/null && exit 0
            sleep 2
          done
          docker logs seaweedfs
          exit 1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run test:e2e

  frontend:
    name: Frontend (typecheck, lint, format, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build

  frontend-e2e:
    name: Frontend (Playwright, mocked API)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      # The two backend-backed specs skip themselves without their env flags.
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: frontend/test-results
          if-no-files-found: ignore

  docker:
    name: Docker (image build, compose file)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Validate docker-compose.yml
        working-directory: backend
        env:
          JWT_SECRET: ci-ci-ci-ci-ci-ci-ci-ci-ci-ci-ci-ci-ci-ci
          GOOGLE_CLIENT_ID: ci
        run: docker compose config --quiet
      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # A single status to mark as required in the branch protection rules.
  ci-passed:
    name: CI passed
    if: always()
    needs: [backend, backend-e2e, frontend, frontend-e2e, docker]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any job did not succeed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for r in $RESULTS; do
            [ "$r" = "success" ] || exit 1
          done
